name: Hub Auto Publisher (scheduled + manual)

on:
  schedule:
    # Restore the original autopilot cadence: one rebuild every four hours (UTC).
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hub-auto-publisher
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests yt-dlp

      - name: Scan new videos and back catalog (up to 10,000 per channel)
        run: python scan_all_channels.py

      - name: Build Hub pages, feeds, and sitemaps
        run: python autopilot_generator.py

      - name: Save updated library and generator state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos_library.json drip_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Scheduled Hub autopilot refresh [skip ci]"
            git push origin HEAD:main
          else
            echo "No library or generator-state changes to commit."
          fi

      - name: Deploy Hub site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site_output
